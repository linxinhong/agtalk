name: Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Build release binary
        run: cargo build -p agtalk --release --features custom-protocol

      - name: Package macOS binary
        run: |
          mkdir -p dist
          cp target/release/agtalk dist/agtalk
          chmod +x dist/agtalk
          cd dist && zip -r ../agtalk-macos.zip agtalk

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: agtalk-macos
          path: agtalk-macos.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: pnpm install
        shell: pwsh
        run: pnpm install 2>&1 | Tee-Object -FilePath pnpm-install.log

      - name: pnpm build
        shell: pwsh
        run: pnpm build 2>&1 | Tee-Object -FilePath pnpm-build.log

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Build release binary
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
        run: cargo build -p agtalk --release --features custom-protocol 2>&1 | Tee-Object -FilePath cargo-build.log

      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/agtalk.exe dist/agtalk.exe
          Compress-Archive -Path dist/agtalk.exe -DestinationPath agtalk-windows.zip

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: agtalk-windows
          path: agtalk-windows.zip
          if-no-files-found: error

      - name: Dump Windows build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = @('pnpm-install.log', 'pnpm-build.log', 'cargo-build.log')
          foreach ($log in $logs) {
            if (Test-Path $log) {
              Write-Output "===== $log ====="
              Get-Content $log -Tail 200
            }
          }

      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            pnpm-install.log
            pnpm-build.log
            cargo-build.log
          if-no-files-found: ignore

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: agtalk-macos
          path: ./release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: agtalk-windows
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.zip
          generate_release_notes: true
